services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php-fpm
      - node
    restart: unless-stopped
    networks:
      - app-network

  php-fpm:
    build:
      context: ./docker/php-fpm
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www/html
    expose:
      - "9000"
    networks:
      - app-network
    restart: unless-stopped

  node:
    image: node:20-alpine
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    ports:
      - "5173:5173"
    environment:
      VITE_DEV_SERVER: "true"
    command: sh -c "yarn && yarn dev"
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
